name: Build release distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag (vX.Y.Z or prerelease)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-liberation
      - name: Derive version from release tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Manual equivalent of github.event.release.tag_name.
          git show-ref --verify --quiet "refs/tags/$TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Hygiene and source validation
        run: |
          python scripts/project_hygiene.py --project-root .
          python scripts/validate_generated_delivery.py --project-root .
      - name: PowerPoint engine self-test
        run: python scripts/itpc/selftest.py
      - name: Candidate presentation rendering
        run: |
          python examples/render_reference_architectures.py --output-dir build/release-review/references --with-previews
          python examples/advanced_compositions.py --output-dir build/release-review/advanced --with-previews
          python scripts/itpc/quality.py examples/anchored-connections.yaml build/release-review/anchors
      - name: Build distributions
        run: python scripts/build_distributions.py --project-root . --version "${{ steps.version.outputs.version }}" --targets project,chat,claude_project,claude_skills,opencode,plugin
      - name: Validate distributions
        run: |
          python scripts/validate_distributions.py --project-root .
          python scripts/check_release_assets.py
      - name: Validate candidate consistency
        run: python scripts/verify_release_candidate.py --project-root . --version "${{ steps.version.outputs.version }}" --output build/release-review/candidate-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-verification
          path: build/release-review/
          if-no-files-found: error
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            args=()
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes "${args[@]}"
          fi
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          files=(dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json)
          for file in "${files[@]}"; do
            test -f "$file"
            if grep -Fxq -- "$(basename "$file")" <<< "$assets"; then
              echo "Release asset already exists: $(basename "$file")"
              exit 1
            fi
          done
          gh release upload "$TAG" "${files[@]}"
