name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-liberation
      - name: Lint
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Validate instruction adherence
        if: ${{ hashFiles('scripts/validate_instruction_adherence.py') != '' }}
        run: python scripts/validate_instruction_adherence.py --project-root .
      - name: Hygiene and source validation
        run: |
          python scripts/project_hygiene.py --project-root .
          python scripts/validate_generated_delivery.py --project-root .
      - name: PowerPoint engine self-test
        run: python scripts/itpc/selftest.py
      - name: Render DEV-012D architecture references
        run: python examples/render_reference_architectures.py --output-dir build/reference-review --with-previews
      - name: Render DEV-012E advanced composition acceptance
        run: python examples/advanced_compositions.py --output-dir build/advanced-review --with-previews
      - name: Render DEV-012F anchored connections
        run: python scripts/itpc/quality.py examples/anchored-connections.yaml build/anchored-review
      - name: Build distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,claude_project,claude_skills,opencode,plugin
      - name: Validate distributions
        run: |
          python scripts/validate_distributions.py --project-root .
          python scripts/check_release_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reference-architecture-previews
          path: build/reference-review/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-composition-previews
          path: build/advanced-review/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: anchored-connections-preview
          path: build/anchored-review/
          if-no-files-found: error
